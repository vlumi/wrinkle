# xcodegen spec; Scripts/generate.sh writes Wrinkle.xcodeproj, which is not
# committed. The logic lives in Packages/WrinkleCore; this is the shell.
name: Wrinkle

options:
  bundleIdPrefix: fi.misaki
  # iOS 26 is the floor: no version fallbacks in the views.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    WRINKLE_BUNDLE_ID: fi.misaki.wrinkle
    # Shared by the app and the notification service extension: the epoch keys the
    # extension decrypts pushes with live in this group's Keychain.
    WRINKLE_APP_GROUP: group.$(WRINKLE_BUNDLE_ID)
    PRODUCT_BUNDLE_IDENTIFIER: $(WRINKLE_BUNDLE_ID)
    PRODUCT_NAME: Wrinkle
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "0"
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    # The team comes from WRINKLE_TEAM_ID in the repository's .env, which
    # Scripts/generate.sh reads; automatic signing does the rest. Simulator
    # builds are unsigned (Scripts/build.sh), so the gate needs no team.
    DEVELOPMENT_TEAM: ${WRINKLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic

packages:
  WrinkleCore:
    path: Packages/WrinkleCore

targets:
  Wrinkle-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
    entitlements:
      path: Sources/iOS/Wrinkle.entitlements
      properties:
        # Development builds get sandbox pushes; TestFlight and the App Store
        # are re-signed for production.
        aps-environment: development
        com.apple.security.application-groups:
          - $(WRINKLE_APP_GROUP)
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Wrinkle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Silent pushes withdraw the notification of a message deleted by its sender.
        UIBackgroundModes:
          - remote-notification
        # A universal app must support all four for iPad multitasking.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Plain ws:// only to local hosts (the simulator's localhost, <mac>.local);
        # the TLS edge's wss:// passes default ATS once its mkcert root is trusted.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Asked the first time the app reaches a backend on the local network.
        NSLocalNetworkUsageDescription: Wrinkle connects to a messaging backend on your local network.
        # Read by WrinkleCore's Vaults, in the app and the extension.
        WrinkleAppGroup: $(WRINKLE_APP_GROUP)
    dependencies:
      - package: WrinkleCore
        product: WrinkleKit
      - target: Wrinkle-NotificationService
    # Explicit scheme so xcodegen writes a shared one; `xcodebuild -scheme
    # Wrinkle-iOS` then works on a fresh checkout.
    scheme:
      configVariants: []

  # Decrypts message pushes ("mutable-content") with the epoch keys the app shares
  # through the app group.
  Wrinkle-NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WRINKLE_BUNDLE_ID).NotificationService
        PRODUCT_NAME: WrinkleNotificationService
    entitlements:
      path: Sources/NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - $(WRINKLE_APP_GROUP)
    info:
      path: Sources/NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Wrinkle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WrinkleAppGroup: $(WRINKLE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    dependencies:
      - package: WrinkleCore
        product: WrinkleCore
