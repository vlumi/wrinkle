version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
plugins:
  - local: protoc-gen-go
    out: proto/go
    opt: paths=source_relative
    strategy: all
  - local: protoc-gen-go-grpc
    out: proto/go
    opt: paths=source_relative
    strategy: all
  - local: protoc-gen-swift
    out: clients/ios/Packages/WrinkleCore/Sources/WrinkleCore/Contract
    opt:
      - Visibility=Public
      - FileNaming=DropPath
    # The iOS client speaks the device contract only.
    include_imports: false
  - local: protoc-gen-elixir
    out: backends/elixir/lib/wrinkle/proto
    opt:
      - plugins=grpc
  - local: clients/web/node_modules/.bin/protoc-gen-es
    out: clients/web/src/gen
    opt:
      - target=ts
  - local: backends/ts/node_modules/.bin/protoc-gen-es
    out: backends/ts/src/gen
    opt:
      - target=js+dts
      - import_extension=js
