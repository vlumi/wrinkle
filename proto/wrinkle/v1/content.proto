// What devices encrypt. The servers never see these messages: a device
// seals a serialized Content into Message.sealed and the recipients' devices
// open it.
//
// Cryptography (X25519, HKDF-SHA256 with a salt of 32 zero bytes and 32
// bytes out, AES-256-GCM with a 12-byte nonce and the 16-byte tag appended;
// integers big-endian, ids as raw bytes, device ids as 8 bytes):
//
// - Wrapping an epoch key K for recipient device R, by sender device S:
//   wk = HKDF(X25519(S, R), info = "wrinkle wrap v1" || conversation_id ||
//   epoch (4 bytes) || S's user id || S's device id || R's user id || R's
//   device id); wrapped = nonce || AES-GCM(wk, nonce, K, no associated
//   data), 60 bytes. R unwraps with X25519(R, S).
// - Sealing: AES-GCM(K, nonce, serialized Content, associated data =
//   "wrinkle content v1" || conversation_id || epoch (4 bytes) ||
//   sender_user_id || client_message_id as UTF-8). A recipient builds the
//   associated data from the message as the server delivers it, so content
//   cannot be moved to another conversation, sender or message.
// - A user's fingerprint: SHA-256("wrinkle fingerprint v1" || user_id ||
//   for each of their devices with a key, by ascending device id: device id
//   || public key). The safety number of two users: h = SHA-256(the smaller
//   fingerprint || the larger, compared bytewise); h's first 30 bytes as six
//   5-byte big-endian numbers, each modulo 100000, written as five digits
//   and separated by spaces. Both users see the same number.
// - An attachment's blob: a random 32-byte key per file; the blob is nonce
//   || AES-GCM(key, nonce, the file, associated data "wrinkle blob v1"),
//   uploaded as application/octet-stream. Its SHA-256 goes in the content,
//   and recipients check it before decrypting.
// - Reactions are sealed like content, with associated data "wrinkle
//   reaction v1" || conversation_id || epoch (4 bytes) || the reacting
//   user's id || the message's seq (8 bytes).

syntax = "proto3";

package wrinkle.v1;

option go_package = "github.com/vlumi/wrinkle/proto/go/wrinkle/v1;wrinklev1";
option java_multiple_files = true;
option java_package = "wrinkle.v1";

message Content {
  oneof body {
    // 1 to 4000 characters.
    string text = 1;
    StickerRef sticker = 2;
    Attachments attachments = 3;
  }
}

message Attachments {
  // 1 to 10, each also listed in the message's blob_ids.
  repeated Attachment items = 1;
  // 0 to 4000 characters.
  string caption = 2;
}

message Attachment {
  bytes blob_id = 1;
  // The file's key, 32 bytes.
  bytes key = 2;
  // SHA-256 of the blob as uploaded.
  bytes digest = 3;
  string media_type = 4;
  // The file's size in bytes, before encryption.
  uint64 size = 5;
  string name = 6;
  // Images: the size in pixels, and a small JPEG preview, at most 16 KiB.
  uint32 width = 7;
  uint32 height = 8;
  bytes thumbnail = 9;
}

message StickerRef {
  bytes sticker_id = 1;
}

// A user's reactions to one message.
message Reactions {
  // 0 to 3 distinct emoji, each one grapheme cluster of at most 32 bytes.
  repeated string emoji = 1;
}
