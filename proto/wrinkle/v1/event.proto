// Events in a user's log. Each of a user's conversations and devices
// contributes to one log; devices read it with a cursor.

syntax = "proto3";

package wrinkle.v1;

import "google/protobuf/timestamp.proto";
import "wrinkle/v1/model.proto";

option go_package = "github.com/vlumi/wrinkle/proto/go/wrinkle/v1;wrinklev1";
option java_multiple_files = true;
option java_package = "wrinkle.v1";

message Event {
  // Position in the user's log, strictly increasing. A device that has
  // processed this event continues from this cursor.
  uint64 cursor = 1;
  google.protobuf.Timestamp occurred_at = 2;
  oneof body {
    MessageEvent message = 10;
    ReadEvent read = 11;
    MessageFailedEvent message_failed = 12;
    ProfileEvent profile = 13;
    DeviceEvent device = 14;
  }
}

// A message was stored in one of the user's conversations. The sender's own
// devices receive it too.
message MessageEvent {
  Message message = 1;
}

// A participant moved their read position. Received by both participants, so
// a user's other devices learn what they read elsewhere.
message ReadEvent {
  bytes conversation_id = 1;
  bytes user_id = 2;
  uint64 seq = 3;
}

// A message accepted by SendMessage could not be delivered to the peer.
// Received by the sender only.
message MessageFailedEvent {
  bytes conversation_id = 1;
  string client_message_id = 2;
  string reason = 3;
}

// A user's profile changed. Received by the user, so their other devices
// learn of it, and by everyone they have a conversation with.
message ProfileEvent {
  User user = 1;
}

// A device of the user signed in, was renamed or signed out. Received by
// the user only.
message DeviceEvent {
  Device device = 1;
  bool signed_out = 2;
}
