// Events in a user's log. Each of a user's conversations and devices
// contributes to one log; devices read it with a cursor.

syntax = "proto3";

package wrinkle.v1;

import "google/protobuf/timestamp.proto";
import "wrinkle/v1/model.proto";

option go_package = "github.com/vlumi/wrinkle/proto/go/wrinkle/v1;wrinklev1";
option java_multiple_files = true;
option java_package = "wrinkle.v1";

message Event {
  // Position in the user's log, strictly increasing. A device that has
  // processed this event continues from this cursor.
  uint64 cursor = 1;
  google.protobuf.Timestamp occurred_at = 2;
  oneof body {
    MessageEvent message = 10;
    ReadEvent read = 11;
    MessageFailedEvent message_failed = 12;
    ProfileEvent profile = 13;
    DeviceEvent device = 14;
    MessageDeletedEvent message_deleted = 15;
    ReactionEvent reaction = 16;
  }
}

// A message was stored in one of the user's conversations. The sender's own
// devices receive it too.
message MessageEvent {
  Message message = 1;
}

// A participant moved their read position. In a direct conversation both
// participants receive it; in a group, the reader and the senders of the
// messages it covers, so each sender sees who has read their messages and
// a user's other devices learn what they read elsewhere.
message ReadEvent {
  bytes conversation_id = 1;
  bytes user_id = 2;
  uint64 seq = 3;
}

// A message accepted by SendMessage could not be delivered to the peer.
// Received by the sender only.
message MessageFailedEvent {
  bytes conversation_id = 1;
  string client_message_id = 2;
  string reason = 3;
}

// A user's profile changed. Received by the user, so their other devices
// learn of it, and by everyone they have a conversation with.
message ProfileEvent {
  User user = 1;
}

// A device signed in, was renamed, set its key or signed out. The user's
// own devices receive every change, with the whole Device. A change to a
// device that has a key also reaches the user's direct partners and the
// members of the user's groups, with only the device id and key, so they
// can encrypt for it and check its user's safety number.
message DeviceEvent {
  Device device = 1;
  bool signed_out = 2;
  bytes user_id = 3;
}

// The sender deleted a message. Received by the conversation's members and
// the sender. The copy of the message in the recipient's log, and the
// conversation list, no longer have its content.
message MessageDeletedEvent {
  bytes conversation_id = 1;
  uint64 seq = 2;
  google.protobuf.Timestamp deleted_at = 3;
}

// A member set or removed their reactions to a message. Received by the
// conversation's current members.
message ReactionEvent {
  bytes conversation_id = 1;
  uint64 seq = 2;
  bytes user_id = 3;
  // Unset when the user removed their reactions.
  Sealed sealed = 4;
  google.protobuf.Timestamp updated_at = 5;
}
