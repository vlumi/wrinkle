// Requests, responses and the types they share.

syntax = "proto3";

package wrinkle.v1;

import "google/protobuf/timestamp.proto";
import "wrinkle/v1/event.proto";
import "wrinkle/v1/model.proto";

option go_package = "github.com/vlumi/wrinkle/proto/go/wrinkle/v1;wrinklev1";
option java_multiple_files = true;
option java_package = "wrinkle.v1";

// Creates an account and signs this device in. Names are unique ignoring
// case and keep the case given: 1 to 64 bytes of UTF-8, without control
// characters or leading or trailing white space. Passwords are 8 to 256
// bytes. A taken name fails with ERROR_CODE_ALREADY_EXISTS. Allowed only
// before Connect; the connection then still has to Connect.
message RegisterRequest {
  string name = 1;
  string password = 2;
  string device_name = 3;
}

message RegisterResponse {
  DeviceCredentials credentials = 1;
}

// Signs a new device in to an existing account; the name is matched ignoring
// case. A wrong name or password fails with ERROR_CODE_UNAUTHENTICATED,
// without saying which. Allowed only before Connect.
message SignInRequest {
  string name = 1;
  string password = 2;
  string device_name = 3;
}

message SignInResponse {
  DeviceCredentials credentials = 1;
}

// What a device keeps to connect again without the password.
message DeviceCredentials {
  bytes user_id = 1;
  uint64 device_id = 2;
  // Opaque; presented in ConnectRequest. Valid until the device signs out or
  // the account's password changes on another device.
  string device_token = 3;
}

// Binds the connection to a signed-in device. Must complete before any
// request other than Register and SignIn. A token that is not valid fails
// with ERROR_CODE_UNAUTHENTICATED and leaves the connection unconnected.
message ConnectRequest {
  string device_token = 1;
}

message ConnectResponse {
  User user = 1;
  uint64 device_id = 2;
  // The cursor this device last acked; 0 for a new device.
  uint64 device_cursor = 3;
  // The newest position in the user's log; 0 when the log is empty.
  uint64 log_head = 4;
}

// Changes the account's password. Every other device of the account is
// signed out: its token stops working. A wrong current password fails with
// ERROR_CODE_UNAUTHENTICATED.
message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

// Changes the requesting user's profile; fields not set are kept. The user's
// own devices and conversation partners receive a ProfileEvent. A name taken
// by another user fails with ERROR_CODE_ALREADY_EXISTS; the user id never
// changes.
message UpdateProfileRequest {
  optional string name = 1;
  // One of the standard icons listed at User.icon, or empty for none.
  optional string icon = 2;
  // A blob uploaded by the user for BLOB_PURPOSE_AVATAR, or empty for none.
  // A blob that is not the user's or not uploaded yet fails with
  // ERROR_CODE_FAILED_PRECONDITION.
  optional bytes avatar = 3;
}

message UpdateProfileResponse {
  User user = 1;
}

// Signs this device out: its token stops working and its push registration
// is removed. The client closes the connection after the response.
message SignOutRequest {}

message SignOutResponse {}

// Lists the account's signed-in devices, this one included.
message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
}

// Renames one of the account's devices, this one included. Names are UTF-8
// of at most 64 bytes.
message RenameDeviceRequest {
  uint64 device_id = 1;
  string name = 2;
}

message RenameDeviceResponse {
  Device device = 1;
}

// Signs out another of the account's devices, as SignOut does for this one;
// its open connections are closed with code 4001. A device that is not the
// account's, or already signed out, fails with ERROR_CODE_NOT_FOUND.
message SignOutDeviceRequest {
  uint64 device_id = 1;
}

message SignOutDeviceResponse {}

// Deletes the account after checking its password (a wrong one fails with
// ERROR_CODE_UNAUTHENTICATED). The name becomes free at once; every device
// is signed out and its connections closed with code 4001; conversation
// partners see a deleted account. The user's event log, conversation list,
// devices and uploads are removed; messages already sent stay with the
// conversations.
message DeleteAccountRequest {
  string password = 1;
}

message DeleteAccountResponse {}

// Asks for a slot to upload a blob to. The client then sends the bytes with
// an HTTP PUT to upload_path, relative to the blob address (see
// frame.proto), with Content-Type and Content-Length exactly as requested,
// before expires_at. A blob nothing refers to a day after the slot was made
// is deleted.
//
// Limits by purpose: avatars image/jpeg, image/png or image/webp up to
// 512 KiB; stickers image/png, image/webp or image/gif up to 256 KiB;
// attachments any media type up to 25 MiB. Beyond them the request fails
// with ERROR_CODE_INVALID_ARGUMENT.
message CreateUploadRequest {
  BlobPurpose purpose = 1;
  string media_type = 2;
  uint64 size = 3;
}

message CreateUploadResponse {
  bytes blob_id = 1;
  // Path and query, starting with /blobs/.
  string upload_path = 2;
  google.protobuf.Timestamp expires_at = 3;
}

enum BlobPurpose {
  BLOB_PURPOSE_UNSPECIFIED = 0;
  BLOB_PURPOSE_AVATAR = 1;
  BLOB_PURPOSE_STICKER = 2;
  BLOB_PURPOSE_ATTACHMENT = 3;
}

// Finds or creates the direct conversation between the requesting user and
// the peer. The peer is found by name, ignoring case.
message OpenConversationRequest {
  string peer_name = 1;
}

message OpenConversationResponse {
  Conversation conversation = 1;
}

// Creates a group with the requesting user as its admin. The topic is 1 to
// 200 bytes of UTF-8, without control characters or white space at either
// end. Members are invited by name, ignoring case; an unknown name fails
// with ERROR_CODE_NOT_FOUND, and the requesting user and repeated names
// are ignored. A group has at most 256 members. Sending again with the same
// client_group_id returns the group created the first time. The group's
// first message is a GroupCreated notice.
message CreateGroupRequest {
  string topic = 1;
  repeated string member_names = 2;
  // Chosen by the device, 1 to 64 bytes, unique per user.
  string client_group_id = 3;
}

message CreateGroupResponse {
  Conversation conversation = 1;
}

// Requests about a group fail with ERROR_CODE_FAILED_PRECONDITION on a
// direct conversation, and with ERROR_CODE_PERMISSION_DENIED from anyone
// not a member.

// Adds users to a group; any member may. Names as in CreateGroup; users
// already members are ignored, and when none is left nothing happens. More
// than 256 members fails with ERROR_CODE_FAILED_PRECONDITION.
message AddMembersRequest {
  bytes conversation_id = 1;
  repeated string member_names = 2;
}

message AddMembersResponse {}

// Removes a member from a group; only admins may. Removing oneself fails
// with ERROR_CODE_INVALID_ARGUMENT (use LeaveGroup), a user who is not a
// member with ERROR_CODE_NOT_FOUND.
message RemoveMemberRequest {
  bytes conversation_id = 1;
  bytes user_id = 2;
}

message RemoveMemberResponse {}

// Leaves a group. When the last admin leaves, the member who joined first
// becomes admin.
message LeaveGroupRequest {
  bytes conversation_id = 1;
}

message LeaveGroupResponse {}

// Changes a group's topic; any member may. The topic as in CreateGroup.
message SetTopicRequest {
  bytes conversation_id = 1;
  string topic = 2;
}

message SetTopicResponse {}

// Makes a member an admin or no longer one; only admins may. Taking it
// from the last admin fails with ERROR_CODE_FAILED_PRECONDITION; a user who
// is not a member, ERROR_CODE_NOT_FOUND.
message SetAdminRequest {
  bytes conversation_id = 1;
  bytes user_id = 2;
  bool admin = 3;
}

message SetAdminResponse {}

// Returns a group's current members, those who joined first first.
message GetMembersRequest {
  bytes conversation_id = 1;
}

message GetMembersResponse {
  repeated Member members = 1;
}

// Sends a text message. Only members may; in a group, someone who left or
// was removed gets ERROR_CODE_PERMISSION_DENIED.
message SendMessageRequest {
  bytes conversation_id = 1;
  string client_message_id = 2;
  string text = 3;
}

message SendMessageResponse {
  Message message = 1;
}

// Deletes one of the requesting user's own messages for everyone: the
// message keeps its seq, loses its content and gets deleted_at. Someone
// else's message fails with ERROR_CODE_PERMISSION_DENIED, a notice with
// ERROR_CODE_INVALID_ARGUMENT, a message the user may not read with
// ERROR_CODE_NOT_FOUND. Deleting a deleted message again does nothing.
// Former members of a group may delete their messages from before they
// left.
message DeleteMessageRequest {
  bytes conversation_id = 1;
  uint64 seq = 2;
}

message DeleteMessageResponse {}

// Marks the conversation read up to seq for the requesting user. Lower than
// the current read position is a no-op.
message MarkReadRequest {
  bytes conversation_id = 1;
  uint64 seq = 2;
}

message MarkReadResponse {}

// Returns events from the user's log after the cursor, oldest first.
message SyncRequest {
  uint64 cursor = 1;
  // Maximum number of events to return; the server may return fewer.
  // 0 means the server's default.
  uint32 limit = 2;
}

message SyncResponse {
  repeated Event events = 1;
  // The cursor to continue from: that of the last event returned, or the
  // request's cursor when there were none.
  uint64 cursor = 2;
  // More events follow; call Sync again with the returned cursor.
  bool has_more = 3;
}

message ListConversationsRequest {}

// Conversations with the most recently active first.
message ListConversationsResponse {
  repeated Conversation conversations = 1;
}

// Returns messages of a conversation, newest first. Group members get the
// messages from the notice that added them on; a former member those up to
// the notice that removed them.
message GetMessagesRequest {
  bytes conversation_id = 1;
  // Return messages with seq below this; 0 starts from the newest.
  uint64 before_seq = 2;
  // 0 means the server's default.
  uint32 limit = 3;
}

message GetMessagesResponse {
  repeated Message messages = 1;
}

// Registers where to push notifications for the requesting device while it
// is not connected. Replaces any earlier registration of the device; an
// empty token removes it.
message RegisterPushTokenRequest {
  PushService service = 1;
  // The token the push service issued to the device, as text; for APNs the
  // device token in hex.
  string token = 2;
}

message RegisterPushTokenResponse {}

enum PushService {
  PUSH_SERVICE_UNSPECIFIED = 0;
  // APNs, development environment: apps built and signed for development.
  PUSH_SERVICE_APNS_SANDBOX = 1;
  // APNs, production environment: TestFlight and App Store builds.
  PUSH_SERVICE_APNS = 2;
}
