// Requests, responses and the types they share.

syntax = "proto3";

package wrinkle.v1;

import "google/protobuf/timestamp.proto";
import "wrinkle/v1/event.proto";
import "wrinkle/v1/model.proto";

option go_package = "github.com/vlumi/wrinkle/proto/go/wrinkle/v1;wrinklev1";
option java_multiple_files = true;
option java_package = "wrinkle.v1";

// Creates an account and signs this device in. Names are unique ignoring
// case and keep the case given: 1 to 64 bytes of UTF-8, without control
// characters or leading or trailing white space. Passwords are 8 to 256
// bytes. A taken name fails with ERROR_CODE_ALREADY_EXISTS. Allowed only
// before Connect; the connection then still has to Connect.
message RegisterRequest {
  string name = 1;
  string password = 2;
  string device_name = 3;
}

message RegisterResponse {
  DeviceCredentials credentials = 1;
}

// Signs a new device in to an existing account; the name is matched ignoring
// case. A wrong name or password fails with ERROR_CODE_UNAUTHENTICATED,
// without saying which. An account has at most 20 signed-in devices; beyond
// them SignIn fails with ERROR_CODE_RESOURCE_EXHAUSTED and
// ERROR_REASON_TOO_MANY_DEVICES. Allowed only before Connect.
message SignInRequest {
  string name = 1;
  string password = 2;
  string device_name = 3;
}

message SignInResponse {
  DeviceCredentials credentials = 1;
}

// What a device keeps to connect again without the password.
message DeviceCredentials {
  bytes user_id = 1;
  uint64 device_id = 2;
  // Opaque; presented in ConnectRequest. Valid until the device signs out or
  // the account's password changes on another device.
  string device_token = 3;
}

// Binds the connection to a signed-in device. Must complete before any
// request other than Register and SignIn. A token that is not valid fails
// with ERROR_CODE_UNAUTHENTICATED and leaves the connection unconnected.
message ConnectRequest {
  string device_token = 1;
}

message ConnectResponse {
  User user = 1;
  uint64 device_id = 2;
  // The cursor this device last acked; 0 for a new device.
  uint64 device_cursor = 3;
  // The newest position in the user's log; 0 when the log is empty. A device
  // without history starts syncing here, after listing its conversations.
  uint64 log_head = 4;
}

// Changes the account's password. Every other device of the account is
// signed out: its token stops working. A wrong current password fails with
// ERROR_CODE_UNAUTHENTICATED.
message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

// Changes the requesting user's profile; fields not set are kept. The user's
// own devices and conversation partners receive a ProfileEvent. A name taken
// by another user fails with ERROR_CODE_ALREADY_EXISTS; the user id never
// changes.
message UpdateProfileRequest {
  optional string name = 1;
  // One of the standard icons listed at User.icon, or empty for none.
  optional string icon = 2;
  // A blob uploaded by the user for BLOB_PURPOSE_AVATAR, or empty for none.
  // A blob that is not the user's or not uploaded yet fails with
  // ERROR_CODE_FAILED_PRECONDITION.
  optional bytes avatar = 3;
}

message UpdateProfileResponse {
  User user = 1;
}

// Signs this device out: its token stops working and its push registration
// is removed. The client closes the connection after the response.
message SignOutRequest {}

message SignOutResponse {}

// Lists the account's signed-in devices, this one included.
message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
}

// Renames one of the account's devices, this one included. Names are UTF-8
// of at most 64 bytes.
message RenameDeviceRequest {
  uint64 device_id = 1;
  string name = 2;
}

message RenameDeviceResponse {
  Device device = 1;
}

// Signs out another of the account's devices, as SignOut does for this one;
// its open connections are closed with code 4001. A device that is not the
// account's, or already signed out, fails with ERROR_CODE_NOT_FOUND.
message SignOutDeviceRequest {
  uint64 device_id = 1;
}

message SignOutDeviceResponse {}

// Deletes the account after checking its password (a wrong one fails with
// ERROR_CODE_UNAUTHENTICATED). The name becomes free at once; every device
// is signed out and its connections closed with code 4001; conversation
// partners see a deleted account. The user's event log, conversation list,
// devices and uploads are removed; messages already sent stay with the
// conversations.
message DeleteAccountRequest {
  string password = 1;
}

message DeleteAccountResponse {}

// Asks for a slot to upload a blob to. The client then sends the bytes with
// an HTTP PUT to upload_path, relative to the blob address (see
// frame.proto), with Content-Type and Content-Length exactly as requested,
// before expires_at. A blob nothing refers to a day after the slot was made
// is deleted.
//
// Limits by purpose: avatars image/jpeg, image/png or image/webp up to
// 512 KiB; stickers image/png, image/webp or image/gif up to 256 KiB;
// attachments application/octet-stream, since they are ciphertext, up to
// 25 MiB. Beyond them the request fails with ERROR_CODE_INVALID_ARGUMENT.
message CreateUploadRequest {
  BlobPurpose purpose = 1;
  string media_type = 2;
  uint64 size = 3;
}

message CreateUploadResponse {
  bytes blob_id = 1;
  // Path and query, starting with /blobs/.
  string upload_path = 2;
  google.protobuf.Timestamp expires_at = 3;
}

enum BlobPurpose {
  BLOB_PURPOSE_UNSPECIFIED = 0;
  BLOB_PURPOSE_AVATAR = 1;
  BLOB_PURPOSE_STICKER = 2;
  BLOB_PURPOSE_ATTACHMENT = 3;
}

// Finds or creates the direct conversation between the requesting user and
// the peer. The peer is found by name, ignoring case; anyone may be messaged,
// contact or not. The requesting user's own name fails with
// ERROR_CODE_INVALID_ARGUMENT: their notes are opened with OpenNotes. A peer the requesting user blocked fails with
// ERROR_CODE_FAILED_PRECONDITION; a peer who blocked the requesting user
// fails with ERROR_CODE_PERMISSION_DENIED.
message OpenConversationRequest {
  string peer_name = 1;
}

message OpenConversationResponse {
  Conversation conversation = 1;
}

// Finds or creates the requesting user's notes, a conversation of their own
// with no one else in it. Every user has one; it is created on first open.
message OpenNotesRequest {}

message OpenNotesResponse {
  Conversation conversation = 1;
}

// Creates a group with the requesting user as its admin. The topic is 1 to
// 200 bytes of UTF-8, without control characters or white space at either
// end. Members are invited by name, ignoring case; an unknown name fails
// with ERROR_CODE_NOT_FOUND, and the requesting user and repeated names
// are ignored. A group has at most 256 members. Sending again with the same
// client_group_id returns the group created the first time. The group's
// first message is a GroupCreated notice. Only the requesting user's
// contacts may be invited: anyone else fails with
// ERROR_CODE_FAILED_PRECONDITION, naming them.
message CreateGroupRequest {
  string topic = 1;
  repeated string member_names = 2;
  // Chosen by the device, 1 to 64 bytes, unique per user.
  string client_group_id = 3;
}

message CreateGroupResponse {
  Conversation conversation = 1;
}

// Requests about a group fail with ERROR_CODE_FAILED_PRECONDITION on a
// direct conversation, and with ERROR_CODE_PERMISSION_DENIED from anyone
// not a member.

// Adds users to a group; any member may. Names as in CreateGroup; users
// already members are ignored, and when none is left nothing happens. More
// than 256 members fails with ERROR_CODE_FAILED_PRECONDITION, as does adding
// a user who is not the requesting member's contact. Members already in the
// group stay whatever their contacts.
message AddMembersRequest {
  bytes conversation_id = 1;
  repeated string member_names = 2;
}

message AddMembersResponse {}

// Removes a member from a group; only admins may. Removing oneself fails
// with ERROR_CODE_INVALID_ARGUMENT (use LeaveGroup), a user who is not a
// member with ERROR_CODE_NOT_FOUND.
message RemoveMemberRequest {
  bytes conversation_id = 1;
  bytes user_id = 2;
}

message RemoveMemberResponse {}

// Leaves a group. When the last admin leaves, the member who joined first
// becomes admin.
message LeaveGroupRequest {
  bytes conversation_id = 1;
}

message LeaveGroupResponse {}

// Changes a group's topic; any member may. The topic as in CreateGroup.
message SetTopicRequest {
  bytes conversation_id = 1;
  string topic = 2;
}

message SetTopicResponse {}

// Makes a member an admin or no longer one; only admins may. Taking it
// from the last admin fails with ERROR_CODE_FAILED_PRECONDITION; a user who
// is not a member, ERROR_CODE_NOT_FOUND.
message SetAdminRequest {
  bytes conversation_id = 1;
  bytes user_id = 2;
  bool admin = 3;
}

message SetAdminResponse {}

// Returns a group's current members, those who joined first first.
message GetMembersRequest {
  bytes conversation_id = 1;
}

message GetMembersResponse {
  repeated Member members = 1;
}

// Sends a message. Only members may; in a group, someone who left or was
// removed gets ERROR_CODE_PERMISSION_DENIED. The content is sealed with the
// conversation's current key epoch: an older one, or none published yet,
// fails with ERROR_CODE_FAILED_PRECONDITION, as does any epoch while the
// conversation needs a new one (see PublishKeys). In a direct conversation,
// blocking refuses as in OpenConversation, in both directions; in a group,
// blocking changes nothing on the services and clients hide what blocked
// users send.
message SendMessageRequest {
  bytes conversation_id = 1;
  string client_message_id = 2;
  reserved 3;
  reserved "text";
  Sealed sealed = 4;
  // The attachments the sealed content refers to, at most 10, each an
  // upload of the sender's for BLOB_PURPOSE_ATTACHMENT, already uploaded
  // (otherwise ERROR_CODE_FAILED_PRECONDITION). The blobs hold ciphertext
  // only (content.proto); listing them lets the services keep them while
  // the message exists.
  repeated bytes blob_ids = 5;
}

message SendMessageResponse {
  Message message = 1;
}

// Deletes one of the requesting user's own messages for everyone: the
// message keeps its seq, loses its content and gets deleted_at. Someone
// else's message fails with ERROR_CODE_PERMISSION_DENIED, a notice with
// ERROR_CODE_INVALID_ARGUMENT, a message the user may not read with
// ERROR_CODE_NOT_FOUND. Deleting a deleted message again does nothing.
// Former members of a group may delete their messages from before they
// left.
message DeleteMessageRequest {
  bytes conversation_id = 1;
  uint64 seq = 2;
}

message DeleteMessageResponse {}

// Sets the requesting user's reactions to a message, replacing any earlier
// ones; without sealed, removes them. Only current members may react, not
// to notices (ERROR_CODE_INVALID_ARGUMENT) nor deleted messages
// (ERROR_CODE_FAILED_PRECONDITION). The sealed Reactions follow the key
// epoch rules of SendMessage; the ciphertext is at most 1 KiB. Reactions
// are not messages: they take no seq and are never unread. Blocking refuses
// reactions in a direct conversation as SendMessage does.
message SetReactionRequest {
  bytes conversation_id = 1;
  uint64 seq = 2;
  Sealed sealed = 3;
}

message SetReactionResponse {}

// Stickers are made by users and public; anyone may save any sticker to
// their palette, at most 200, in their own order. Sending one is a message
// whose sealed content names it (content.proto).

// Makes an uploaded blob (BLOB_PURPOSE_STICKER) a sticker, with the blob's
// id, and saves it to the creator's palette unless that is full. A blob
// that is not the user's sticker upload, or not uploaded yet, fails with
// ERROR_CODE_FAILED_PRECONDITION. Making the same sticker again returns it.
message CreateStickerRequest {
  bytes blob_id = 1;
}

message CreateStickerResponse {
  Sticker sticker = 1;
}

// Returns the known stickers among up to 100 ids, in the order asked.
message GetStickersRequest {
  repeated bytes sticker_ids = 1;
}

message GetStickersResponse {
  repeated Sticker stickers = 1;
}

message GetPaletteRequest {}

message GetPaletteResponse {
  repeated Sticker stickers = 1;
}

// Adds a sticker at the end of the palette. An unknown sticker fails with
// ERROR_CODE_NOT_FOUND, a full palette with ERROR_CODE_FAILED_PRECONDITION;
// one already saved stays where it is.
message SaveStickerRequest {
  bytes sticker_id = 1;
}

message SaveStickerResponse {}

message RemoveStickerRequest {
  bytes sticker_id = 1;
}

message RemoveStickerResponse {}

// Moves a saved sticker before another, or to the end when
// before_sticker_id is empty. A sticker not in the palette fails with
// ERROR_CODE_NOT_FOUND.
message MoveStickerRequest {
  bytes sticker_id = 1;
  bytes before_sticker_id = 2;
}

message MoveStickerResponse {}

// End-to-end encryption. Each device has an X25519 key pair and publishes
// the public key; each conversation has key epochs, an epoch key made by a
// member device and wrapped for every member device. A conversation needs a
// new epoch after its membership changes (the server then refuses sends
// until one is published) and when the members' devices differ from the
// current epoch's recipients (devices notice that and publish one before
// sending). A user's new device gets the keys of earlier epochs from the
// user's other devices.

// Publishes this device's public key, once. The same key again does
// nothing; a different one fails with ERROR_CODE_FAILED_PRECONDITION (a
// device with a new key signs in as a new device).
message SetDeviceKeyRequest {
  // X25519, 32 bytes.
  bytes public_key = 1;
}

message SetDeviceKeyResponse {}

// Returns the signed-in devices with keys of up to 256 users, each with
// only its id and key. Unknown and deleted users are left out.
message GetDeviceKeysRequest {
  repeated bytes user_ids = 1;
}

message GetDeviceKeysResponse {
  repeated UserDevices users = 1;
}

message UserDevices {
  bytes user_id = 1;
  repeated Device devices = 2;
}

// Publishes wrapped keys of a conversation, from this device, which must
// have a key; only current members may. Epoch key_epoch + 1 starts a new
// epoch, every recipient a current member; the current epoch takes more
// recipients, current members; an older epoch only this user's own devices
// (sharing history with a new device). Any other epoch fails with
// ERROR_CODE_FAILED_PRECONDITION: another device published first. So does a
// request for an existing epoch with a key for the requesting device itself,
// unless that device made the epoch: a device publishing a new epoch
// includes itself, so the loser of two publishing the same epoch learns it
// lost instead of joining the winner's epoch with its own key. Wraps a
// recipient already has are kept. At most 500 keys, each for a signed-in
// device with a key (ERROR_CODE_INVALID_ARGUMENT otherwise); a new epoch with
// more recipients continues as the current epoch. In a direct conversation
// with a block either way, keys for the other user fail as SendMessage does.
message PublishKeysRequest {
  bytes conversation_id = 1;
  uint32 epoch = 2;
  repeated WrappedKey keys = 3;
}

message PublishKeysResponse {}

message WrappedKey {
  bytes recipient_user_id = 1;
  uint64 recipient_device_id = 2;
  // The epoch key wrapped for the recipient device: 60 bytes.
  bytes wrapped = 3;
}

// Returns the conversation's key state and the keys wrapped for this
// device in epochs after after_epoch, oldest first. Former members get the
// keys they had.
message GetConversationKeysRequest {
  bytes conversation_id = 1;
  uint32 after_epoch = 2;
  // Keys to return, oldest first: 0 means 100, at most 100.
  uint32 limit = 3;
}

message GetConversationKeysResponse {
  // 0 while no epoch has been published.
  uint32 current_epoch = 1;
  // The membership changed since the current epoch; sends fail until the
  // next is published.
  bool rotate = 2;
  // Every device the current epoch's key is wrapped for. Empty, as is
  // rotate, for a former member, who learns nothing of the membership now.
  repeated KeyRecipient current_recipients = 3;
  repeated ReceivedKey keys = 4;
  // More keys follow: ask again with after_epoch the last key's epoch.
  bool has_more = 5;
}

message KeyRecipient {
  bytes user_id = 1;
  uint64 device_id = 2;
}

message ReceivedKey {
  uint32 epoch = 1;
  bytes sender_user_id = 2;
  uint64 sender_device_id = 3;
  // As the server has it for the sending device; devices check it against
  // the key they know for that device.
  bytes sender_public_key = 4;
  bytes wrapped = 5;
}

// Marks the conversation read up to seq for the requesting user. Lower than
// the current read position is a no-op. In a direct conversation with a block
// either way, the read event goes to the reader's own devices only.
message MarkReadRequest {
  bytes conversation_id = 1;
  uint64 seq = 2;
}

message MarkReadResponse {}

// Returns events from the user's log after the cursor, oldest first. The
// log keeps events for a retention period, 30 days by default, and drops
// older ones; a cursor before the oldest kept event fails with
// ERROR_CODE_CURSOR_EXPIRED, since events after it are gone. The device then
// starts over as one without history: from ConnectResponse.log_head, with
// the conversation list, contacts and history fetched again, as anything it
// kept may have changed meanwhile.
message SyncRequest {
  uint64 cursor = 1;
  // Maximum number of events to return; the server may return fewer, and
  // does past 512 KiB of them. 0 means the server's default.
  uint32 limit = 2;
}

message SyncResponse {
  repeated Event events = 1;
  // The cursor to continue from: that of the last event returned, or the
  // request's cursor when there were none.
  uint64 cursor = 2;
  // More events follow; call Sync again with the returned cursor.
  bool has_more = 3;
}

// A page of the user's conversations, the most recently active first:
// up to limit (0 means 100, at most 200), and fewer past 512 KiB of them.
// The next page starts at the page token the last one returned.
message ListConversationsRequest {
  bytes page_token = 1;
  uint32 limit = 2;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  // Empty on the last page; else pass it as the next request's page_token.
  bytes next_page_token = 2;
}

// Returns messages of a conversation, newest first. Group members get the
// messages from the notice that added them on; a former member those up to
// the notice that removed them.
message GetMessagesRequest {
  bytes conversation_id = 1;
  // Return messages with seq below this; 0 starts from the newest.
  uint64 before_seq = 2;
  // 0 means the server's default; the server returns fewer past 512 KiB.
  uint32 limit = 3;
}

message GetMessagesResponse {
  repeated Message messages = 1;
  // Older messages the user may read follow: ask again with before_seq the
  // lowest seq returned. A short page does not mean the end.
  bool has_more = 2;
}

// Registers where to push notifications for the requesting device while it
// is not connected. Replaces any earlier registration of the device; an
// empty token removes it.
message RegisterPushTokenRequest {
  PushService service = 1;
  // The token the push service issued to the device, as text; for APNs the
  // device token in hex, up to 200 characters (ERROR_CODE_INVALID_ARGUMENT
  // otherwise).
  string token = 2;
}

message RegisterPushTokenResponse {}

enum PushService {
  PUSH_SERVICE_UNSPECIFIED = 0;
  // APNs, development environment: apps built and signed for development.
  PUSH_SERVICE_APNS_SANDBOX = 1;
  // APNs, production environment: TestFlight and App Store builds.
  PUSH_SERVICE_APNS = 2;
}

// Contacts. Each user keeps their own side: a request (or an acceptance),
// or a block. Two users are contacts when both asked. Every change reaches
// both users' devices as a ContactEvent, each with the state as that user
// sees it. A user who blocked the requesting user looks like anyone else:
// requests about them fail with ERROR_CODE_PERMISSION_DENIED and say no
// more, and their state is CONTACT_STATE_UNSPECIFIED.

// Lists the users the requesting user has any state with: contacts,
// requests both ways and blocked users, at most 1000 of each, deleted
// accounts left out.
message ListContactsRequest {}

message ListContactsResponse {
  repeated Contact contacts = 1;
}

// Asks a user to be a contact, or accepts their request. By name, ignoring
// case, or by id. Asking again changes nothing. Asking oneself fails with
// ERROR_CODE_INVALID_ARGUMENT, an unknown user with ERROR_CODE_NOT_FOUND, a
// user the requesting user blocked with ERROR_CODE_FAILED_PRECONDITION
// (unblock first), and one who blocked the requesting user with
// ERROR_CODE_PERMISSION_DENIED.
message AddContactRequest {
  oneof user {
    string name = 1;
    bytes user_id = 2;
  }
}

message AddContactResponse {
  Contact contact = 1;
}

// Ends any contact with the user, for both: removes a contact, declines
// their request or withdraws one's own. Nothing to end changes nothing. A
// block stays (see UnblockUser).
message RemoveContactRequest {
  bytes user_id = 1;
}

message RemoveContactResponse {}

// Blocks a user: any contact or request between the two ends, and the
// blocked user can no longer open or write to a direct conversation with
// the requesting user, react there, ask to be a contact, or add them to a
// group. Shared groups stay; clients hide what the blocked user sends in
// them. Blocking again changes nothing; blocking oneself fails with
// ERROR_CODE_INVALID_ARGUMENT.
message BlockUserRequest {
  bytes user_id = 1;
}

message BlockUserResponse {}

// Lifts a block; no contact comes back. A user not blocked changes nothing.
message UnblockUserRequest {
  bytes user_id = 1;
}

message UnblockUserResponse {}
