// Types shared by requests, responses and events.

syntax = "proto3";

package wrinkle.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vlumi/wrinkle/proto/go/wrinkle/v1;wrinklev1";
option java_multiple_files = true;
option java_package = "wrinkle.v1";

// Ids of users and conversations are random UUIDs (version 4), 16 bytes.

message User {
  bytes user_id = 1;
  string name = 2;
  // A standard icon, or empty for none. The standard icons, by key, with the
  // emoji clients draw them as: cat 🐱, dog 🐶, fox 🦊, owl 🦉, bear 🐻,
  // frog 🐸, panda 🐼, rabbit 🐰, tiger 🐯, penguin 🐧, octopus 🐙,
  // unicorn 🦄.
  string icon = 3;
  // An uploaded picture, by blob id (see frame.proto for where blobs are
  // read); empty for none. Shown instead of the icon when set.
  bytes avatar = 4;
  // The account was deleted: the name is empty and free for others, and
  // clients show the user as a deleted account.
  bool deleted = 5;
}

// A device signed in to the requesting user's account.
message Device {
  uint64 device_id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  // When the device last connected or acked.
  google.protobuf.Timestamp last_seen_at = 4;
  // The device has registered for push notifications.
  bool push = 5;
}

// A message in a conversation. (conversation_id, seq) identifies it; seq is
// assigned by the conversation when the message is stored, is dense (1, 2,
// 3, ...), and orders the conversation for everyone.
message Message {
  bytes conversation_id = 1;
  uint64 seq = 2;
  bytes sender_user_id = 3;
  // Chosen by the sending device, unique per sender and conversation. Resending
  // with the same id returns the message already stored instead of a duplicate.
  // The server chooses it for notices.
  string client_message_id = 4;
  google.protobuf.Timestamp sent_at = 6;
  oneof content {
    string text = 5;
    // A change to a group, made by the sender.
    Notice notice = 7;
  }
  // Set once the sender deleted the message; its content is then unset.
  google.protobuf.Timestamp deleted_at = 8;
}

// A change to a group, as a message in its sequence, so every member sees
// changes and messages in the same order.
message Notice {
  oneof kind {
    GroupCreated group_created = 1;
    MembersAdded members_added = 2;
    MemberRemoved member_removed = 3;
    MemberLeft member_left = 4;
    TopicChanged topic_changed = 5;
    AdminChanged admin_changed = 6;
  }
}

// The sender created the group, as its admin.
message GroupCreated {
  string topic = 1;
  // The members invited at creation, besides the sender.
  repeated User members = 2;
}

message MembersAdded {
  repeated User users = 1;
}

// An admin removed the user.
message MemberRemoved {
  User user = 1;
}

// The sender left.
message MemberLeft {
  // Made admin because the sender was the last one; unset otherwise.
  User promoted = 1;
}

message TopicChanged {
  string topic = 1;
}

message AdminChanged {
  User user = 1;
  bool admin = 2;
}

// A direct conversation has exactly two participants, for good; a group
// has a topic, an admin or more, and members who join and leave. The kind
// is fixed when the conversation is created.
enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_DIRECT = 1;
  CONVERSATION_KIND_GROUP = 2;
}

// A conversation as seen by the requesting user.
message Conversation {
  bytes conversation_id = 1;
  ConversationKind kind = 7;
  // Direct conversations: the other participant.
  User peer = 2;
  // Highest message seq in the conversation; 0 when empty.
  uint64 last_seq = 3;
  // Unset when the conversation is empty.
  Message last_message = 4;
  // The requesting user's read position; messages with seq above it are
  // unread. Sending a message moves the sender's own position to it.
  uint64 read_seq = 5;
  // Direct conversations: the peer's read position.
  uint64 peer_read_seq = 6;
  // Groups: the topic, the number of members, whether the requesting user
  // is still a member (false once they left or were removed; the
  // conversation stays, with the history they had) and an admin.
  string topic = 8;
  uint32 member_count = 9;
  bool member = 10;
  bool admin = 11;
}

// A current member of a group.
message Member {
  User user = 1;
  bool admin = 2;
  // The member's read position.
  uint64 read_seq = 3;
  // The seq of the notice that added the member; they see messages from
  // there on.
  uint64 joined_seq = 4;
}
