// Types shared by requests, responses and events.

syntax = "proto3";

package wrinkle.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vlumi/wrinkle/proto/go/wrinkle/v1;wrinklev1";
option java_multiple_files = true;
option java_package = "wrinkle.v1";

// Ids of users and conversations are random UUIDs (version 4), 16 bytes.

message User {
  bytes user_id = 1;
  string name = 2;
  // A standard icon, or empty for none. The standard icons, by key, with the
  // emoji clients draw them as: cat 🐱, dog 🐶, fox 🦊, owl 🦉, bear 🐻,
  // frog 🐸, panda 🐼, rabbit 🐰, tiger 🐯, penguin 🐧, octopus 🐙,
  // unicorn 🦄.
  string icon = 3;
  // An uploaded picture, by blob id (see frame.proto for where blobs are
  // read); empty for none. Shown instead of the icon when set.
  bytes avatar = 4;
  // The account was deleted: the name is empty and free for others, and
  // clients show the user as a deleted account.
  bool deleted = 5;
}

// A device signed in to the requesting user's account.
message Device {
  uint64 device_id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  // When the device last connected or acked.
  google.protobuf.Timestamp last_seen_at = 4;
  // The device has registered for push notifications.
  bool push = 5;
}

// A message in a conversation. (conversation_id, seq) identifies it; seq is
// assigned by the conversation when the message is stored, is dense (1, 2,
// 3, ...), and orders the conversation for everyone.
message Message {
  bytes conversation_id = 1;
  uint64 seq = 2;
  bytes sender_user_id = 3;
  // Chosen by the sending device, unique per sender and conversation. Resending
  // with the same id returns the message already stored instead of a duplicate.
  string client_message_id = 4;
  string text = 5;
  google.protobuf.Timestamp sent_at = 6;
}

// A conversation as seen by the requesting user.
message Conversation {
  bytes conversation_id = 1;
  User peer = 2;
  // Highest message seq in the conversation; 0 when empty.
  uint64 last_seq = 3;
  // Unset when the conversation is empty.
  Message last_message = 4;
  // The requesting user's read position; messages with seq above it are
  // unread. Sending a message moves the sender's own position to it.
  uint64 read_seq = 5;
  // The peer's read position.
  uint64 peer_read_seq = 6;
}
