// The wire protocol: one WebSocket connection per device, binary messages,
// each message one serialized Frame.
//
// Endpoint: wss://<host>:<port>/v1/ws, or ws:// on the loopback interface.
// Passwords travel in Register, SignIn and ChangePassword, so anything else
// needs TLS.
//
// The client sends requests, acks and pings; the server sends responses,
// events and pongs. A connection starts unconnected: it may Register or
// SignIn, which return a device token, and must then Connect with a token
// before anything else; other requests before it fail with
// ERROR_CODE_UNAUTHENTICATED. Register, SignIn and Connect after Connect
// fail with ERROR_CODE_FAILED_PRECONDITION.
//
// Responses carry the id of the request they answer. Requests may be
// answered out of order. Events are pushed as they are appended to the
// user's log; a device fills gaps by calling Sync with its cursor.
//
// Limits: a frame is at most 64 KiB; Connect must complete within 5 seconds
// of the connection opening or of the response to its last Register or
// SignIn; a connection may have 32 requests in flight and send 50 frames a
// second on average, in bursts of 100. Requests beyond the limits fail with
// ERROR_CODE_RESOURCE_EXHAUSTED; other frames beyond them are dropped. The
// server sends WebSocket pings every 30 seconds and closes a connection it
// has received nothing on for 90.
//
// Connect waits up to 5 seconds for the user's pushes to be set up. If they
// are not, it fails with ERROR_CODE_UNAVAILABLE and the connection stays
// open but not connected; the client may send Connect again within a fresh
// 5 seconds.
//
// Blobs (avatars, stickers, attachments) are read with a plain HTTP GET of
// /blobs/<lowercase hex blob id> and uploaded with the PUT CreateUpload
// describes, at the blob address: https://<host>:<port> of a wss endpoint,
// or http://<host>:9200 beside a ws endpoint on the loopback interface.
// Blobs never change, so clients cache them for good.
//
// The server closes a connection with these codes; after the first six, a
// client reconnects with backoff and syncs:
//   1001  the server is shutting down or the connection was idle
//   1003  a text frame
//   1008  a malformed or unexpected frame, or no Connect in time
//   1009  a frame over the size limit
//   1011  an internal error
//   1013  the client did not keep up with its events
//   4001  the device was signed out, or the account deleted; the client
//         forgets its credentials and does not reconnect

syntax = "proto3";

package wrinkle.v1;

import "wrinkle/v1/event.proto";
import "wrinkle/v1/messaging.proto";

option go_package = "github.com/vlumi/wrinkle/proto/go/wrinkle/v1;wrinklev1";
option java_multiple_files = true;
option java_package = "wrinkle.v1";

message Frame {
  oneof kind {
    Request request = 1;
    Response response = 2;
    Event event = 3;
    Ack ack = 4;
    Ping ping = 5;
    Pong pong = 6;
  }
}

message Request {
  // Chosen by the client, unique within the connection; echoed in the response.
  uint64 id = 1;
  oneof body {
    ConnectRequest connect = 10;
    OpenConversationRequest open_conversation = 11;
    SendMessageRequest send_message = 12;
    MarkReadRequest mark_read = 13;
    SyncRequest sync = 14;
    ListConversationsRequest list_conversations = 15;
    GetMessagesRequest get_messages = 16;
    RegisterPushTokenRequest register_push_token = 17;
    RegisterRequest register = 18;
    SignInRequest sign_in = 19;
    ChangePasswordRequest change_password = 20;
    UpdateProfileRequest update_profile = 21;
    SignOutRequest sign_out = 22;
    ListDevicesRequest list_devices = 23;
    RenameDeviceRequest rename_device = 24;
    SignOutDeviceRequest sign_out_device = 25;
    DeleteAccountRequest delete_account = 26;
    CreateUploadRequest create_upload = 27;
  }
}

message Response {
  uint64 request_id = 1;
  oneof body {
    Error error = 2;
    ConnectResponse connect = 10;
    OpenConversationResponse open_conversation = 11;
    SendMessageResponse send_message = 12;
    MarkReadResponse mark_read = 13;
    SyncResponse sync = 14;
    ListConversationsResponse list_conversations = 15;
    GetMessagesResponse get_messages = 16;
    RegisterPushTokenResponse register_push_token = 17;
    RegisterResponse register = 18;
    SignInResponse sign_in = 19;
    ChangePasswordResponse change_password = 20;
    UpdateProfileResponse update_profile = 21;
    SignOutResponse sign_out = 22;
    ListDevicesResponse list_devices = 23;
    RenameDeviceResponse rename_device = 24;
    SignOutDeviceResponse sign_out_device = 25;
    DeleteAccountResponse delete_account = 26;
    CreateUploadResponse create_upload = 27;
  }
}

message Error {
  ErrorCode code = 1;
  // Human-readable detail, for logs; not meant to be shown to users or parsed.
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // A field is missing, malformed, or out of range.
  ERROR_CODE_INVALID_ARGUMENT = 1;
  // The connection has not completed Connect, or the credentials are wrong.
  ERROR_CODE_UNAUTHENTICATED = 2;
  // The user is not a participant of the conversation.
  ERROR_CODE_PERMISSION_DENIED = 3;
  // The user or conversation does not exist.
  ERROR_CODE_NOT_FOUND = 4;
  // The request is valid but not allowed in the connection's current state,
  // such as a second Connect.
  ERROR_CODE_FAILED_PRECONDITION = 5;
  // A dependency is down or overloaded; the client may retry.
  ERROR_CODE_UNAVAILABLE = 6;
  ERROR_CODE_INTERNAL = 7;
  // The connection is over its request limits; the client may retry later.
  ERROR_CODE_RESOURCE_EXHAUSTED = 8;
  // The name is taken.
  ERROR_CODE_ALREADY_EXISTS = 9;
}

// The device has processed its user's log up to this cursor. The server
// remembers it per device; the next Connect returns it.
message Ack {
  uint64 cursor = 1;
}

// Application-level keepalive, for clients that cannot send WebSocket pings.
// Either side may ping; the other replies with a pong.
message Ping {}

message Pong {}
