# Shared infrastructure for every backend. Memory is capped, about 6 GB in
# all, so the stack fits in Docker's 8 GB; backends run beside it. Every port is published
# on loopback only: the backends run on the host and reach it there.
# GRAFANA_BIND=0.0.0.0 opens Grafana to the network. The load balancer, in
# the lb profile, serves devices on loopback port 8080 like a gateway; the
# TLS edge, in the tls profile, faces the network on 8443. Blobs are in
# Garage, behind a proxy on loopback port 9200. The database is one of two
# profiles, chosen by infra/up.sh: vitess, the default, or mysql, the same
# schema unsharded on one MySQL; both serve the MySQL protocol on port 15003
# and answer to the name db on the network.

name: wrinkle

services:
  vitess:
    build: ./vitess
    image: wrinkle/vttestserver:v24.0.4
    profiles: [vitess]
    networks:
      default:
        aliases: [db]
    environment:
      KEYSPACES: conversation,user
      NUM_SHARDS: 2,2
      PORT: "15000"
      INNODB_BUFFER_POOL_SIZE: 512M
    ports:
      - "127.0.0.1:15000:15000" # vtcombo HTTP
      - "127.0.0.1:15001:15001" # vtcombo gRPC (VStream for Debezium)
      - "127.0.0.1:15003:15003" # MySQL protocol through vtgate
    volumes:
      - ../schema:/vt/schema:ro
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "15003", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits:
          memory: 1536M

  mysql:
    image: mysql:8.4.9
    profiles: [mysql]
    networks:
      default:
        aliases: [db]
    # Row-based binlog with full images for Debezium's MySQL connector; the
    # pool and connection limit as in the Vitess profile's mysqld.
    command:
      - --port=15003
      - --server-id=1
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --innodb-buffer-pool-size=512M
      - --max-connections=1000
      - --character-set-server=utf8mb4
      - --skip-name-resolve
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:15003:15003" # MySQL protocol, where vtgate is in the other profile
    volumes:
      - ../schema:/schema:ro
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # Only the final server listens on TCP, after the schema is loaded.
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "15003", "-u", "root", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits:
          memory: 1536M

  # The cold tier of the history, standalone. Clients find the region
  # server by the name it advertises, hbase.localhost: on the network an
  # alias of this container, on the host loopback, where its ports are.
  hbase:
    build: ./hbase
    image: wrinkle/hbase:2.6.7
    hostname: hbase.localhost
    networks:
      default:
        aliases: [hbase.localhost]
    environment:
      HBASE_HEAPSIZE: 512m
    ports:
      - "127.0.0.1:2181:2181" # ZooKeeper, where clients start
      - "127.0.0.1:16000:16000" # master
      - "127.0.0.1:16010:16010" # master web UI
      - "127.0.0.1:16020:16020" # region server
    healthcheck:
      # Ready once the region server has reported to the master.
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:16010/jmx?qry=Hadoop:service=HBase,name=Master,sub=Server' | grep -q '\"numRegionServers\": 1'"]
      interval: 5s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits:
          memory: 1024M

  # HBase's REST server, for the backends without a native client.
  hbase-rest:
    image: wrinkle/hbase:2.6.7
    command: ["hbase", "rest", "start", "-p", "8086", "--infoport", "8087"]
    environment:
      HBASE_HEAPSIZE: 192m
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      hbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/version/cluster >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits:
          memory: 384M

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 16
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:19092:19092" # from the host; inside the network use kafka:9092
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1024M

  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    depends_on:
      kafka:
        condition: service_healthy
      vitess:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "127.0.0.1:8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/connectors"]
      interval: 5s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        limits:
          memory: 1280M

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 256M

  # Only with the tls profile (make tls-up): TLS for devices on the network,
  # in front of whatever serves port 8080 on the host.
  edge:
    image: haproxy:3.4.6
    profiles: [tls]
    volumes:
      - ./edge/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs:/usr/local/etc/haproxy/certs:ro
    ports:
      - "${TLS_BIND:-0.0.0.0}:8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "socat", "-u", "/dev/null", "TCP:127.0.0.1:8443"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Only with the lb profile (make lb-up): one address in front of the
  # side-by-side gateways, facing the network like a gateway does, and one
  # in front of the services instances, for the gateways.
  haproxy:
    image: haproxy:3.4.6
    profiles: [lb]
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # On loopback: devices on the network come through the TLS edge.
      - "${LB_BIND:-127.0.0.1}:8080:8080"
      - "127.0.0.1:9100:9100" # the services, for the gateways on this host
      - "127.0.0.1:8404:8404" # statistics
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "socat", "-u", "/dev/null", "TCP:127.0.0.1:8080"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 64M

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 256M

  valkey:
    image: valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--maxmemory", "128mb", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 256M

  garage:
    image: dxflrs/garage:v2.4.1
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 256M

  # The blob address on loopback; devices on the network come through the
  # TLS edge, which forwards /blobs/ here.
  blobs:
    image: haproxy:3.4.6
    volumes:
      - ./blobs/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:9200:9200"
    depends_on:
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "socat", "-u", "/dev/null", "TCP:127.0.0.1:9200"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  prometheus-data:
