# TLS in front of whatever serves devices on this host's port 8080: a
# monolith, the side-by-side balancer or the cluster. Devices on the network
# connect to wss://<address>:8443/v1/ws; port 8080 itself listens on
# loopback only, so passwords never cross the network in clear text. Blobs
# are read and uploaded at /blobs/ on the same address.
global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  # Health checks connect and close without a request; not worth a line each.
  option dontlognull
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  # WebSocket connections are idle between messages; the gateways ping every 30 s.
  timeout tunnel 1h

frontend devices
  bind :8443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem alpn http/1.1
  http-request deny unless { path /v1/ws } || { path_beg /blobs/ }
  # From the network, only what devices do with blobs: read one, unsigned,
  # and upload one with the PUT a backend presigned. Nothing else reaches
  # the storage API, whoever holds a key.
  acl blob path_reg ^/blobs/[0-9a-f]{32}$
  acl signed url_param(X-Amz-Signature) -m found
  http-request deny if { path_beg /blobs/ } !blob
  http-request deny if blob !METH_OPTIONS !{ method PUT } signed
  http-request deny if blob { method PUT } !signed
  http-request deny if blob !METH_GET !METH_HEAD !METH_OPTIONS !{ method PUT }
  use_backend blobs if blob
  default_backend host

backend blobs
  server blobs blobs:9200

backend host
  server host host.docker.internal:8080
