# TLS in front of whatever serves devices on this host's port 8080: a
# monolith, the side-by-side balancer or the cluster. Devices on the network
# connect to wss://<address>:8443/v1/ws; port 8080 itself listens on
# loopback only, so passwords never cross the network in clear text.
global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  # WebSocket connections are idle between messages; the gateways ping every 30 s.
  timeout tunnel 1h

frontend devices
  bind :8443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem alpn http/1.1
  http-request deny unless { path /v1/ws }
  default_backend host

backend host
  server host host.docker.internal:8080
