# The cluster's balancer (make cluster-up). The same two jobs as haproxy.cfg,
# but the replicas are found by name through Docker's DNS, so each kind can
# run in any number up to its template's size. Statistics on :8404.
global
  log stdout format raw local0

# Short holds, so a kind scaled down drops out within seconds, rather than
# its slots keeping addresses Docker may hand to new containers.
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 2
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
  hold obsolete 1s
  hold nx 1s
  hold timeout 1s
  hold refused 1s
  hold other 1s
  accepted_payload_size 8192

defaults
  mode http
  log global
  option httplog
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h

frontend devices
  bind :8080
  http-request deny unless { path /v1/ws }
  default_backend gateways

backend gateways
  balance leastconn
  option httpchk GET /healthz
  http-check expect status 200
  default-server check inter 1s fall 2 rise 1 resolvers docker init-addr none
  server-template go 8 go-gw:8080
  server-template elixir 8 elixir-gw:8080
  server-template rust 8 rust-gw:8080
  server-template java 8 java-gw:8080

# Inside the cluster only: the gateways' gRPC, one request per stream.
frontend rpc
  bind :9100 proto h2
  timeout client 1h
  default_backend services

backend services
  balance roundrobin
  default-server proto h2 check inter 1s fall 2 rise 1 resolvers docker init-addr none
  server-template go 8 go-services:9000
  server-template java 8 java-services:9000

frontend stats
  bind :8404
  stats enable
  stats uri /
  stats refresh 2s
