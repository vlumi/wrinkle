# The balancers for the side-by-side setup. Devices: each new connection goes
# to the healthy gateway with the fewest, and when a gateway stops, its devices
# reconnect and land on the others. Services: each gateway keeps one HTTP/2
# connection, so requests, not connections, are spread over the services
# instances. Statistics on :8404.
global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  # Health checks connect and close without a request; not worth a line each.
  option dontlognull
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  # WebSocket connections are idle between messages; the gateways ping every 30 s.
  timeout tunnel 1h

frontend devices
  bind :8080
  # Devices reach the WebSocket endpoint only; metrics, health and profiles
  # stay on the gateways.
  http-request deny unless { path /v1/ws }
  default_backend gateways

backend gateways
  balance leastconn
  option httpchk GET /healthz
  http-check expect status 200
  default-server check inter 1s fall 2 rise 1
  server go host.docker.internal:8180
  server elixir host.docker.internal:8181
  server rust host.docker.internal:8182
  server java host.docker.internal:8183

# The internal RPC, gRPC over cleartext HTTP/2, one request per stream.
frontend rpc
  bind :9100 proto h2
  timeout client 1h
  default_backend services

# Instance n serves the RPC on 9100+n, whichever language it is written in.
# The check is a connection to that port: a stopped instance drops out.
backend services
  balance roundrobin
  default-server proto h2 check inter 1s fall 2 rise 1
  server s1 host.docker.internal:9101
  server s2 host.docker.internal:9102
  server s3 host.docker.internal:9103
  server s4 host.docker.internal:9104

frontend stats
  bind :8404
  stats enable
  stats uri /
  stats refresh 2s
