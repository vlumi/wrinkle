# One address for the side-by-side gateways: each new connection goes to the
# healthy gateway with the fewest, and when a gateway stops, its devices
# reconnect and land on the others. Statistics on :8404.
global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  # WebSocket connections are idle between messages; clients ping well within this.
  timeout tunnel 1h

frontend devices
  bind :8080
  # Each gateway's metrics are scraped from the gateway itself.
  http-request deny if { path /metrics }
  default_backend gateways

backend gateways
  balance leastconn
  option httpchk GET /healthz
  http-check expect status 200
  default-server check inter 1s fall 2 rise 1
  server go host.docker.internal:8180
  server elixir host.docker.internal:8181
  server rust host.docker.internal:8182

frontend stats
  bind :8404
  stats enable
  stats uri /
  stats refresh 2s
