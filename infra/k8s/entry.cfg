# Forwards connections, unchanged, to the Kubernetes balancer (entry.yml).
global
  log stdout format raw local0

defaults
  mode tcp
  log global
  option dontlognull
  timeout connect 2s
  timeout client 1h
  timeout server 1h

frontend devices
  bind :8080
  default_backend balancer

backend balancer
  server balancer "${K8S_NODE}:31080"

frontend stats
  bind :8404
  default_backend balancer-stats

backend balancer-stats
  server balancer "${K8S_NODE}:31404"
