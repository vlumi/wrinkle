# The gateways, one Deployment per language, each with a headless Service
# the balancer finds its pods by. Elixir and Rust are gateways only and need
# no role. Replicas are set by infra/k8s.sh, not here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-gw
spec:
  selector:
    matchLabels: {app: go-gw}
  template:
    metadata:
      labels: {app: go-gw, tier: gateway}
    spec:
      containers:
        - name: go
          image: wrinkle/go:dev
          imagePullPolicy: Never
          args: [--roles, gateway]
          envFrom:
            - configMapRef: {name: gateway}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: go-gw
spec:
  clusterIP: None
  selector: {app: go-gw}
  ports:
    - {name: http, port: 8080}
---
