# The Kubernetes balancer: the same two jobs as the Compose cluster's
# (haproxy/cluster.cfg), finding the pods through each kind's headless
# Service. Kubernetes' own Services balance connections, so they would pin
# each gateway's one HTTP/2 connection to one services pod; HAProxy spreads
# its requests instead. Statistics on :8404.
global
  log stdout format raw local0

# Short holds, as in the Compose cluster: a pod's address goes to the next
# pod started, of any kind.
resolvers kube
  parse-resolv-conf
  resolve_retries 2
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
  hold obsolete 1s
  hold nx 1s
  hold timeout 1s
  hold refused 1s
  hold other 1s
  accepted_payload_size 8192

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  timeout tunnel 1h

frontend devices
  bind :8080
  http-request deny unless { path /v1/ws }
  default_backend gateways

backend gateways
  balance leastconn
  option httpchk GET /healthz
  http-check expect status 200
  default-server check inter 1s fall 2 rise 1 resolvers kube init-addr none
  server-template go 8 go-gw.wrinkle.svc.cluster.local:8080
  server-template elixir 8 elixir-gw.wrinkle.svc.cluster.local:8080
  server-template rust 8 rust-gw.wrinkle.svc.cluster.local:8080
  server-template java 8 java-gw.wrinkle.svc.cluster.local:8080
  server-template ts 8 ts-gw.wrinkle.svc.cluster.local:8080

# Inside Kubernetes only: the gateways' gRPC, one request per stream.
frontend rpc
  bind :9100 proto h2
  timeout client 1h
  default_backend services

backend services
  balance roundrobin
  default-server proto h2 check inter 1s fall 2 rise 1 resolvers kube init-addr none
  server-template go 8 go-services.wrinkle.svc.cluster.local:9000
  server-template java 8 java-services.wrinkle.svc.cluster.local:9000
  server-template ts 8 ts-services.wrinkle.svc.cluster.local:9000

frontend stats
  bind :8404
  stats enable
  stats uri /
  stats refresh 2s
