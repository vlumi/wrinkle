# A Prometheus agent (prometheus.yml), allowed to list the namespace's pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics
subjects:
  - kind: ServiceAccount
    name: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics
spec:
  replicas: 1
  selector:
    matchLabels: {app: metrics}
  template:
    metadata:
      labels: {app: metrics}
    spec:
      serviceAccountName: metrics
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --agent
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.agent.path=/prometheus
          resources:
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: metrics}
        - name: data
          emptyDir: {}
