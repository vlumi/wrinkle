# The blob address: GET /blobs/<id> reads a blob from Garage's web endpoint,
# a PUT or DELETE signed by the services goes to its S3 API. Requests are
# signed for the host name "blobs", so the Host header is set to it whatever
# address a device used; the TLS edge forwards /blobs/ here.
global
  log stdout format raw local0

defaults
  mode http
  log global
  timeout connect 2s
  timeout client 60s
  timeout server 60s

frontend blobs
  bind :9200
  # Pages served from another origin upload with fetch.
  http-request return status 204 hdr Access-Control-Allow-Origin "*" hdr Access-Control-Allow-Methods "GET, HEAD, PUT" hdr Access-Control-Allow-Headers "Content-Type" hdr Access-Control-Max-Age 86400 if METH_OPTIONS
  http-response set-header Access-Control-Allow-Origin "*"
  http-request deny unless { path_beg /blobs/ }
  http-request set-header Host blobs
  acl signed url_param(X-Amz-Signature) -m found
  http-request deny unless signed || METH_GET || METH_HEAD
  use_backend s3 if signed
  default_backend web

backend s3
  server garage garage:3900

backend web
  # Blobs never change.
  http-response set-header Cache-Control "public, max-age=31536000, immutable" if { status 200 }
  http-request set-path %[path,regsub(^/blobs/,/)]
  server garage garage:3902
