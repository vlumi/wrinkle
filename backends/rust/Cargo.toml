[package]
name = "wrinkle"
version = "0.1.0"
edition = "2024"
description = "The Rust gateway: WebSocket connections on tokio, forwarding requests to a services process over the internal RPC."
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
libc = "0.2"
memory-stats = "1"
prost = "0.14"
prost-types = "0.14"
redis = { version = "1", features = ["tokio-comp"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tonic-prost-build = "0.14"

[profile.release]
debug = 1
